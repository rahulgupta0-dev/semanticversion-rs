[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "semantic_version"
version = "0.1.0"
description = "Rust port of python-semanticversion — Port Mortem 2026, Track D"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.8"

[tool.maturin]
module-name = "semantic_version"
features = ["extension-module"]
