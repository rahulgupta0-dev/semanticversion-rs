[package]
name = "semanticversion-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of python-semanticversion — Port Mortem 2026, Track D"
license = "BSD-2-Clause"

[lib]
name = "semantic_version"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
thiserror = "2"
regex = "1"
pyo3 = { version = "0.25", features = ["auto-initialize"] }

[dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }  # added with bench module
